<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海戰指令：修正版</title>
    <style>
        :root {
            --bg: #f4ece1; --grid-bg: #ffffff; --border: #dcd0c0;
            --ship: #8b7355; --sunk: #3e3327; --hit: #e67e22; --accent: #a89078;
        }

        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; color: #5d5c5c; overflow-x: hidden; }
        
        #menu { display: flex; flex-direction: column; gap: 20px; margin-top: 60px; text-align: center; }
        .btn { padding: 15px 40px; font-size: 18px; border: none; background: var(--ship); color: white; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #6d5a42; transition: 0.1s; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #6d5a42; }
        
        #gameArea { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; padding: 10px; }
        .status-bar { width: 90%; background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; width: 90vw; max-width: 380px; background: var(--border); border: 2px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 5px; }
        .cell { aspect-ratio: 1; background: var(--grid-bg); position: relative; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
        
        .ship-part { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .ship-part svg { width: 90%; height: 90%; fill: var(--ship); }
        
        .hit { background: #fff4e6 !important; }
        .hit::after { content: '💥'; position: absolute; font-size: 20px; animation: boom 0.5s forwards; }
        .miss::after { content: ''; width: 6px; height: 6px; background: #ccc; border-radius: 50%; }
        .sunk svg { fill: var(--sunk) !important; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }

        @keyframes boom { 0% { transform: scale(0); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
        
        .label { font-size: 12px; font-weight: bold; color: var(--accent); width: 100%; margin: 8px 0 3px; display: flex; justify-content: space-between; }
        #myBoard .cell { background: #fcfaf2; }
        .progress-highlight { color: var(--hit); font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="margin-bottom:0;">海戰指令</h1>
        <p style="margin-top:5px; color:var(--accent);">與老婆的祕密對戰</p>
        <button class="btn" onclick="initGame('online')">連線對戰 (WiFi/5G)</button>
        <button class="btn" style="background:#d2b48c;" onclick="initGame('vs_computer')">單機挑戰電腦</button>
    </div>

    <div id="gameArea">
        <div class="status-bar">
            <b id="status">準備佈署艦隊</b><br>
            <span id="instruction">請在「我方陣地」依序放置船隻</span>
        </div>
        
        <div class="label"><span>敵方海域 (RADAR)</span><span id="enemy-stat">剩餘: 5</span></div>
        <div class="grid" id="enemyBoard"></div>
        
        <div class="label"><span>我方陣地 (HOME)</span><span id="my-stat">狀態: 正常</span></div>
        <div class="grid" id="myBoard"></div>
        
        <button style="margin-top:20px; background:none; border:none; color:#999; text-decoration:underline;" onclick="location.reload()">放棄並返回主選單</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const fleetSchema = [4, 3, 2, 2, 1];
        let currentShipIdx = 0, gameMode = '', myFleet = [], computerFleet = [], isReady = false, myTurn = false, tempP = [];

        const SVGS = {
            single: `<svg viewBox="0 0 40 40"><path d="M5,20 Q5,5 20,5 Q35,5 35,20 Q35,35 20,35 Q5,35 5,20" /></svg>`,
            head: `<svg viewBox="0 0 40 40" style="transform:rotate(180deg)"><path d="M40,5 L20,5 Q5,5 5,20 Q5,35 20,35 L40,35 Z" /></svg>`,
            body: `<svg viewBox="0 0 40 40"><rect x="0" y="5" width="40" height="30" /></svg>`,
            tail: `<svg viewBox="0 0 40 40" style="transform:rotate(180deg)"><path d="M0,5 L20,5 Q35,5 35,20 Q35,35 20,35 L0,35 Z" /></svg>`
        };

        function initGame(mode) {
            gameMode = mode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            const eb = document.getElementById('enemyBoard'), mb = document.getElementById('myBoard');
            for (let i = 0; i < 100; i++) {
                const e = document.createElement('div'); e.className = 'cell'; e.id = `enemy-${i}`; e.onclick = () => attack(i); eb.appendChild(e);
                const m = document.createElement('div'); m.className = 'cell'; m.id = `my-${i}`; m.onclick = () => deploy(i); mb.appendChild(m);
            }
            if(mode === 'vs_computer') setupComputer();
            updateInstruction();
        }

        function deploy(i) {
            if (isReady) return;
            const target = fleetSchema[currentShipIdx];

            if (tempP.includes(i)) {
                tempP = tempP.filter(x => x !== i);
                renderTempFleet(); updateInstruction(); return;
            }

            if (tempP.length > 0) {
                const last = tempP[tempP.length - 1];
                const diff = Math.abs(i - last);
                if (diff !== 1 && diff !== 10) return;
                if (diff === 1 && Math.floor(i / 10) !== Math.floor(last / 10)) return;
            }

            tempP.push(i);
            renderTempFleet();

            if (tempP.length === target) {
                myFleet.push({ cells: [...tempP], hits: 0, sunk: false, len: target });
                tempP = []; currentShipIdx++;
                if (currentShipIdx === fleetSchema.length) {
                    isReady = true;
                    if(gameMode === 'online') {
                        document.getElementById('status').innerText = "✅ 艦隊就位";
                        document.getElementById('instruction').innerText = "等待對手連線中...";
                        socket.emit('ready', { fleet: myFleet });
                    } else {
                        myTurn = true;
                        document.getElementById('status').innerText = "你的回合";
                        document.getElementById('instruction').innerText = "請點擊上方「敵方海域」進行攻擊";
                    }
                }
            }
            updateInstruction();
        }

        function renderTempFleet() {
            tempP.forEach(idx => document.getElementById(`my-${idx}`).innerHTML = '');
            const target = fleetSchema[currentShipIdx];
            let isVertical = tempP.length >= 2 ? Math.abs(tempP[1] - tempP[0]) === 10 : false;
            const rot = isVertical ? "rotate(90deg)" : "rotate(0deg)";

            tempP.forEach((idx, step) => {
                let asset = SVGS.body;
                if (target === 1) asset = SVGS.single;
                else if (step === 0) asset = SVGS.head;
                else if (step === tempP.length - 1 && tempP.length === target) asset = SVGS.tail;
                document.getElementById(`my-${idx}`).innerHTML = `<div class="ship-part" style="transform:${rot}">${asset}</div>`;
            });
        }

        function updateInstruction() {
            if (isReady) return;
            const target = fleetSchema[currentShipIdx];
            document.getElementById('instruction').innerHTML = `請佈署 <b class="progress-highlight">${target}格長</b> 的艦艇 (進度: ${tempP.length}/${target})`;
        }

        function attack(i) {
            if (!isReady || !myTurn) return;
            const cell = document.getElementById(`enemy-${i}`);
            if (cell.dataset.attacked) return;
            cell.dataset.attacked = "true";

            if (gameMode === 'vs_computer') {
                const s = computerFleet.find(x => x.cells.includes(i));
                processHit('enemy', i, s);
                if (isReady) { myTurn = false; setTimeout(computerAction, 600); }
            } else { socket.emit('attack', { index: i }); myTurn = false; document.getElementById('status').innerText = "對手回合"; }
        }

        function processHit(prefix, index, ship) {
            const cell = document.getElementById(`${prefix}-${index}`);
            if (ship) {
                cell.classList.add('hit'); ship.hits++;
                if (ship.hits === ship.cells.length) {
                    ship.sunk = true;
                    ship.cells.forEach(c => document.getElementById(`${prefix}-${c}`).classList.add('sunk'));
                    const remaining = (prefix === 'enemy' ? computerFleet : myFleet).filter(s => !s.sunk).length;
                    if (prefix === 'enemy') document.getElementById('enemy-stat').innerText = `剩餘: ${remaining}`;
                    if (remaining === 0) { isReady = false; alert(prefix === 'enemy' ? "大獲全勝！🎉" : "艦隊全滅...😭"); location.reload(); }
                }
            } else cell.classList.add('miss');
        }

        function computerAction() {
            if (!isReady) return;
            let t; do { t = Math.floor(Math.random()*100); } while (document.getElementById(`my-${t}`).dataset.attacked);
            document.getElementById(`my-${t}`).dataset.attacked = "true";
            processHit('my', t, myFleet.find(s => s.cells.includes(t)));
            myTurn = true; document.getElementById('status').innerText = "你的回合";
        }

        function setupComputer() {
            fleetSchema.forEach(len => {
                let ok = false;
                while(!ok) {
                    let s = Math.floor(Math.random()*100), v = Math.random()>0.5, c = [];
                    for(let i=0; i<len; i++) {
                        let n = v ? s+i*10 : s+i;
                        if(n >= 100 || (!v && Math.floor(n/10) !== Math.floor(s/10))) { c=[]; break; }
                        c.push(n);
                    }
                    if(c.length && c.every(x => !computerFleet.some(ship => ship.cells.includes(x)))) {
                        computerFleet.push({cells:c, hits:0, sunk:false}); ok = true;
                    }
                }
            });
        }

        socket.on('gameStart', (id) => { 
            myTurn = (socket.id === id); 
            document.getElementById('status').innerText = myTurn ? "你的回合" : "對手回合";
            document.getElementById('instruction').innerText = myTurn ? "請點擊上方敵軍海域！" : "對方正在瞄準我方...";
        });

        socket.on('opp-attack', (d) => {
            const s = myFleet.find(x => x.cells.includes(d.index));
            processHit('my', d.index, s);
            socket.emit('result', { index: d.index, isHit: !!s, isSunk: s?.sunk, shipCells: s?.cells });
            myTurn = true; document.getElementById('status').innerText = "你的回合";
            document.getElementById('instruction').innerText = "該你反擊了！";
        });

        socket.on('attack-result', (d) => {
            const c = document.getElementById(`enemy-${d.index}`);
            if (d.isHit) {
                c.classList.add('hit');
                if (d.isSunk) { 
                    d.shipCells.forEach(idx => document.getElementById(`enemy-${idx}`).classList.add('sunk'));
                    const currentRem = parseInt(document.getElementById('enemy-stat').innerText.replace('剩餘: ','')) - 1;
                    document.getElementById('enemy-stat').innerText = `剩餘: ${currentRem}`;
                }
            } else c.classList.add('miss');
        });
    </script>
</body>
</html>
