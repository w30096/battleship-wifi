<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>海戰指令：全能彈性版</title>
    <style>
        :root {
            --bg: #f4ece1; --grid-bg: #ffffff; --border: #dcd0c0;
            --ship: #8b7355; --sunk: #3e3327; --hit: #e67e22; --accent: #a89078;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; touch-action: manipulation; }
        body { font-family: "PingFang TC", sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; color: #5d5c5c; }
        
        #menu { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; gap: 20px; }
        .btn { padding: 15px 40px; font-size: 18px; border: none; background: var(--ship); color: white; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #6d5a42; }

        #gameArea { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; max-width: 500px; padding: 10px 5vw; justify-content: center; }
        .status-bar { width: 100%; background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border); transition: 0.3s; }
        .shooting-now { background: #ffeaa7 !important; border-color: var(--hit) !important; color: #d35400; }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; width: 100%; max-width: 360px; background: var(--border); border: 2px solid var(--border); border-radius: 8px; overflow: hidden; }
        .cell { aspect-ratio: 1; background: var(--grid-bg); position: relative; display: flex; align-items: center; justify-content: center; }

        .ship-part { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .ship-part svg { width: 90%; height: 90%; fill: var(--ship); }
        
        .hit { background: #fff4e6 !important; }
        .hit::after { content: '💥'; position: absolute; font-size: 20px; z-index: 5; }
        .miss { background: #f0f4f7 !important; }
        .miss::after { content: ''; width: 40%; height: 40%; border: 2px solid #adc2d1; border-radius: 50%; opacity: 0.5; }

        .sunk svg { fill: var(--sunk) !important; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }
        
        .label { font-size: 11px; font-weight: bold; color: var(--accent); width: 100%; max-width: 360px; margin: 8px 0 2px; display: flex; justify-content: space-between; }
        #myBoard .cell { background: #fcfaf2; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="margin:0;">海戰指令</h1>
        <p style="color:var(--accent); font-size:14px; margin-top:5px;">彈性佈署優化版</p>
        <button class="btn" onclick="initGame('online')">連線對戰</button>
        <button class="btn" style="background:#d2b48c;" onclick="initGame('vs_computer')">挑戰電腦</button>
    </div>

    <div id="gameArea">
        <div class="status-bar" id="statusBar">
            <b id="status">第 1 艘：佈署 4 格船</b><br>
            <span id="instruction">點擊下方陣地進行放置</span>
        </div>
        
        <div class="label"><span>敵方海域 (RADAR)</span><span id="enemy-stat">尚未開戰</span></div>
        <div class="grid" id="enemyBoard"></div>
        
        <div class="label"><span>我方陣地 (HOME)</span><span id="my-stat">放置進度: 0/12</span></div>
        <div class="grid" id="myBoard"></div>
        
        <button style="margin-top:10px; background:none; border:none; color:#bbb; text-decoration:underline; font-size:12px;" onclick="location.reload()">重新開始</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const fleetSchema = [4, 3, 2, 2, 1];
        let currentShipIdx = 0, gameMode = '', myFleet = [], computerFleet = [], isReady = false, myTurn = false, tempP = [];
        let enemySunkShips = 0;

        const SVGS = {
            single: `<svg viewBox="0 0 40 40"><path d="M5,20 Q5,5 20,5 Q35,5 35,20 Q35,35 20,35 Q5,35 5,20" /></svg>`,
            head: `<svg viewBox="0 0 40 40" style="transform:rotate(180deg)"><path d="M40,5 L20,5 Q5,5 5,20 Q5,35 20,35 L40,35 Z" /></svg>`,
            body: `<svg viewBox="0 0 40 40"><rect x="0" y="5" width="40" height="30" /></svg>`,
            tail: `<svg viewBox="0 0 40 40" style="transform:rotate(180deg)"><path d="M0,5 L20,5 Q35,5 35,20 Q35,35 20,35 L0,35 Z" /></svg>`
        };

        function initGame(mode) {
            gameMode = mode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            for (let i = 0; i < 100; i++) {
                const e = document.createElement('div'); e.className = 'cell'; e.id = `enemy-${i}`; e.onclick = () => attack(i); document.getElementById('enemyBoard').appendChild(e);
                const m = document.createElement('div'); m.className = 'cell'; m.id = `my-${i}`; m.onclick = () => deploy(i); document.getElementById('myBoard').appendChild(m);
            }
            if(mode === 'vs_computer') setupComputer();
        }

        // --- 彈性直線檢查邏輯 ---
        function canPlace(idx, currentTemp) {
            if (currentTemp.length === 0) return true;
            const r = Math.floor(idx / 10), c = idx % 10;
            const rows = currentTemp.map(t => Math.floor(t / 10));
            const cols = currentTemp.map(t => t % 10);

            // 必須在同一行或同一列
            const isHorizontal = rows.every(val => val === r);
            const isVertical = cols.every(val => val === c);
            if (!isHorizontal && !isVertical) return false;

            // 必須與現有格子相鄰且無斷開
            const allOnLine = [...currentTemp, idx].sort((a,b) => a-b);
            for(let i=0; i < allOnLine.length - 1; i++) {
                const diff = allOnLine[i+1] - allOnLine[i];
                if (isHorizontal && diff !== 1) return false;
                if (isVertical && diff !== 10) return false;
            }
            return true;
        }

        function deploy(i) {
            if (isReady) return;
            const target = fleetSchema[currentShipIdx];

            // 取消選取
            if (tempP.includes(i)) {
                tempP = tempP.filter(x => x !== i);
                renderBoard(); return;
            }

            // 重疊檢查
            if (myFleet.some(s => s.cells.includes(i))) return;

            // 彈性佈置檢查
            if (!canPlace(i, tempP)) return;

            tempP.push(i);
            renderBoard();

            if (tempP.length === target) {
                myFleet.push({ cells: [...tempP], hits: 0, sunk: false });
                tempP = []; currentShipIdx++;
                if (currentShipIdx === fleetSchema.length) {
                    startTheGame();
                }
            }
            updateUI();
        }

        function renderBoard() {
            // 清除暫存區視覺
            for (let i = 0; i < 100; i++) {
                if (!myFleet.some(s => s.cells.includes(i))) document.getElementById(`my-${i}`).innerHTML = '';
            }
            if (tempP.length === 0) return;
            const sorted = [...tempP].sort((a,b) => a-b);
            const isVertical = sorted.length >= 2 ? Math.abs(sorted[1] - sorted[0]) === 10 : false;
            const rot = isVertical ? "rotate(90deg)" : "rotate(0deg)";
            
            sorted.forEach((idx, index) => {
                let asset = SVGS.body;
                if (tempP.length === 1 && fleetSchema[currentShipIdx] === 1) asset = SVGS.single;
                else if (index === 0) asset = SVGS.head;
                else if (index === sorted.length - 1 && sorted.length === fleetSchema[currentShipIdx]) asset = SVGS.tail;
                document.getElementById(`my-${idx}`).innerHTML = `<div class="ship-part" style="transform:${rot}">${asset}</div>`;
            });
        }

        function updateUI() {
            const placedCells = myFleet.reduce((acc, s) => acc + s.cells.length, 0) + tempP.length;
            document.getElementById('my-stat').innerText = `放置進度: ${placedCells}/12`;
            if (!isReady) {
                document.getElementById('status').innerText = `第 ${currentShipIdx + 1} 艘：佈署 ${fleetSchema[currentShipIdx]} 格船`;
                document.getElementById('instruction').innerText = `(進度: ${tempP.length}/${fleetSchema[currentShipIdx]})`;
            }
        }

        function startTheGame() {
            isReady = true;
            const bar = document.getElementById('statusBar');
            bar.classList.add('shooting-now');
            document.getElementById('enemy-stat').innerText = "敵軍剩餘: 5 艘";

            if (gameMode === 'online') {
                document.getElementById('status').innerText = "✅ 準備就緒";
                document.getElementById('instruction').innerText = "等待對方玩家佈署中...";
                socket.emit('ready', { fleet: myFleet });
            } else {
                myTurn = true;
                document.getElementById('status').innerText = "🎯 你的回合：開始射擊！";
                document.getElementById('instruction').innerText = "點擊上方敵方海域進行砲擊";
            }
        }

        function attack(i) {
            if (!isReady || !myTurn) return;
            const cell = document.getElementById(`enemy-${i}`);
            if (cell.dataset.attacked) return;
            cell.dataset.attacked = "true";

            if (gameMode === 'vs_computer') {
                const s = computerFleet.find(x => x.cells.includes(i));
                handleResult('enemy', i, s, computerFleet);
                if (isReady) { myTurn = false; setTimeout(computerMove, 600); }
            } else { socket.emit('attack', { index: i }); myTurn = false; }
        }

        function handleResult(prefix, idx, ship, fleet) {
            const cell = document.getElementById(`${prefix}-${idx}`);
            if (ship) {
                cell.classList.add('hit'); ship.hits++;
                if (ship.hits === ship.cells.length) {
                    ship.sunk = true;
                    ship.cells.forEach(c => document.getElementById(`${prefix}-${c}`).classList.add('sunk'));
                    if (prefix === 'enemy') enemySunkShips++;
                }
            } else cell.classList.add('miss');

            const sunkCount = fleet.filter(s => s.sunk).length;
            if (prefix === 'enemy') document.getElementById('enemy-stat').innerText = `敵軍剩餘: ${fleet.length - sunkCount} 艘`;
            if (sunkCount === fleet.length) {
                isReady = false;
                setTimeout(() => { alert(prefix === 'enemy' ? "🎉 恭喜你贏了！" : "😭 你輸了，艦隊全滅..."); location.reload(); }, 500);
            }
        }

        function computerMove() {
            let t; do { t = Math.floor(Math.random()*100); } while (document.getElementById(`my-${t}`).dataset.attacked);
            document.getElementById(`my-${t}`).dataset.attacked = "true";
            handleResult('my', t, myFleet.find(s => s.cells.includes(t)), myFleet);
            if (isReady) {
                myTurn = true;
                document.getElementById('status').innerText = "🎯 你的回合：開始射擊！";
            }
        }

        function setupComputer() {
            fleetSchema.forEach(len => {
                let ok = false;
                while(!ok) {
                    let s = Math.floor(Math.random()*100), v = Math.random()>0.5, c = [];
                    for(let i=0; i<len; i++) {
                        let n = v ? s+i*10 : s+i;
                        if(n >= 100 || (!v && Math.floor(n/10) !== Math.floor(s/10))) { c=[]; break; }
                        c.push(n);
                    }
                    if(c.length && c.every(x => !computerFleet.some(ship => ship.cells.includes(x)))) {
                        computerFleet.push({cells:c, hits:0, sunk:false}); ok = true;
                    }
                }
            });
        }

        socket.on('gameStart', (id) => { 
            myTurn = (socket.id === id); 
            const bar = document.getElementById('statusBar');
            bar.classList.add('shooting-now');
            document.getElementById('status').innerText = myTurn ? "🎯 你的回合：開始射擊！" : "⚓ 對手回合中..."; 
            document.getElementById('instruction').innerText = myTurn ? "點擊敵方海域進行砲擊" : "請小心敵軍砲火！";
        });

        socket.on('opp-attack', (d) => {
            const s = myFleet.find(x => x.cells.includes(d.index));
            handleResult('my', d.index, s, myFleet);
            socket.emit('result', { index: d.index, isHit: !!s, isSunk: s?.sunk, shipCells: s?.cells });
            if (isReady) myTurn = true;
        });

        socket.on('attack-result', (d) => {
            const c = document.getElementById(`enemy-${d.index}`);
            if (d.isHit) {
                c.classList.add('hit');
                if (d.isSunk) {
                    d.shipCells.forEach(idx => document.getElementById(`enemy-${idx}`).classList.add('sunk'));
                    enemySunkShips++;
                }
            } else c.classList.add('miss');
            if (enemySunkShips === fleetSchema.length) { isReady = false; alert("🎉 你贏了！"); location.reload(); }
        });
    </script>
</body>
</html>
