<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海戰指令：旗艦版</title>
    <style>
        :root {
            --bg-color: #f4ece1;     /* 奶茶色 */
            --grid-bg: #ffffff;      
            --border-color: #dcd0c0; /* 橡木色 */
            --ship-color: #8b7355;   /* 原木色 */
            --sunk-color: #3e3327;   /* 焦木色 */
            --hit-color: #e67e22;    /* 爆炸橘 */
            --accent: #a89078;
        }

        body { font-family: "PingFang TC", sans-serif; background: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; color: #5d5c5c; user-select: none; }
        #menu { display: flex; flex-direction: column; gap: 20px; margin-top: 80px; text-align: center; }
        .btn { padding: 15px 40px; font-size: 18px; border: none; background: var(--ship-color); color: white; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #6d5a42; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #6d5a42; }

        #gameArea { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 450px; padding-bottom: 20px; }
        .status-bar { width: 90%; background: #fff; padding: 10px; border-radius: 10px; margin: 10px 0; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .board-label { width: 90%; font-size: 13px; font-weight: bold; margin: 8px 0 3px; color: var(--accent); display: flex; justify-content: space-between; }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; width: 90vw; max-width: 380px; background: var(--border-color); border: 2px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .cell { aspect-ratio: 1; background: var(--grid-bg); position: relative; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        .ship-part { width: 90%; height: 90%; display: flex; align-items: center; justify-content: center; }
        .ship-part svg { width: 100%; height: 100%; fill: var(--ship-color); transition: fill 0.5s; }
        
        .hit { background: #fff4e6 !important; }
        .miss::after { content: ''; width: 6px; height: 6px; background: #ccc; border-radius: 50%; }
        .sunk svg { fill: var(--sunk-color) !important; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }

        .boom { position: absolute; font-size: 20px; z-index: 10; animation: explode 0.5s ease-out forwards; pointer-events: none; }
        @keyframes explode {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        #myBoard .cell { background: #fcfaf2; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="margin-bottom:0;">海戰指令</h1>
        <p style="margin-top:5px; color:var(--accent);">與老婆的外出對戰版</p>
        <button class="btn" onclick="initGame('online')">連線對戰 (Wi-Fi/5G)</button>
        <button class="btn" style="background:#d2b48c;" onclick="initGame('vs_computer')">單機挑戰電腦</button>
    </div>

    <div id="gameArea">
        <div class="status-bar">
            <b id="status">準備佈署艦隊</b><br>
            <small id="instruction">請在下方「我方陣地」放置船隻</small>
        </div>
        <div class="board-label"><span>敵方海域 (RADAR)</span><span id="enemy-stat">剩餘船隻: 5</span></div>
        <div class="grid" id="enemyBoard"></div>
        <div class="board-label"><span>我方陣地 (HOME)</span><span id="my-stat">狀態: 正常</span></div>
        <div class="grid" id="myBoard"></div>
        <button style="margin-top:20px; color:#aaa; background:none; border:none;" onclick="location.reload()">回主選單</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const fleetSchema = [4, 3, 2, 2, 1]; 
        let currentShipIdx = 0, gameMode = '', myFleet = [], computerFleet = [], isReady = false, myTurn = false, tempP = [];

        const SVGS = {
            single: `<svg viewBox="0 0 40 40"><path d="M5,20 Q5,5 20,5 Q35,5 35,20 Q35,35 20,35 Q5,35 5,20" /></svg>`,
            head: `<svg viewBox="0 0 40 40" style="transform:rotate(180deg)"><path d="M40,5 L20,5 Q5,5 5,20 Q5,35 20,35 L40,35 Z" /></svg>`,
            body: `<svg viewBox="0 0 40 40"><rect x="0" y="5" width="40" height="30" /></svg>`,
            tail: `<svg viewBox="0 0 40 40" style="transform:rotate(180deg)"><path d="M0,5 L20,5 Q35,5 35,20 Q35,35 20,35 L0,35 Z" /></svg>`
        };

        function initGame(mode) {
            gameMode = mode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            const eb = document.getElementById('enemyBoard'), mb = document.getElementById('myBoard');
            for (let i = 0; i < 100; i++) {
                const eCell = document.createElement('div'); eCell.className = 'cell'; eCell.id = `enemy-${i}`;
                eCell.onclick = () => attack(i); eb.appendChild(eCell);
                const mCell = document.createElement('div'); mCell.className = 'cell'; mCell.id = `my-${i}`;
                mCell.onclick = () => deploy(i); mb.appendChild(mCell);
            }
            if(mode === 'vs_computer') setupComputer();
        }

        function deploy(i) {
            if (isReady) return;
            const targetLen = fleetSchema[currentShipIdx];
            if (tempP.length > 0) {
                const last = tempP[tempP.length - 1];
                if (Math.abs(i - last) !== 1 && Math.abs(i - last) !== 10) return;
            }
            if (!tempP.includes(i)) {
                tempP.push(i);
                const cell = document.getElementById(`my-${i}`);
                let asset = (targetLen === 1) ? SVGS.single : (tempP.length === 1 ? SVGS.head : (tempP.length === targetLen ? SVGS.tail : SVGS.body));
                cell.innerHTML = `<div class="ship-part">${asset}</div>`;
            }
            if (tempP.length === targetLen) {
                myFleet.push({ cells: [...tempP], hits: 0, sunk: false });
                tempP = []; currentShipIdx++;
                if (currentShipIdx < fleetSchema.length) document.getElementById('instruction').innerText = `請放置 ${fleetSchema[currentShipIdx]} 格船`;
                else {
                    isReady = true; document.getElementById('status').innerText = "艦隊就緒";
                    if(gameMode === 'online') socket.emit('ready', { fleet: myFleet });
                    else { myTurn = true; document.getElementById('status').innerText = "你的回合"; }
                }
            }
        }

        function attack(i) {
            if (!isReady || !myTurn) return;
            const cell = document.getElementById(`enemy-${i}`);
            if (cell.dataset.attacked) return;
            cell.dataset.attacked = "true";
            if (gameMode === 'vs_computer') {
                const ship = computerFleet.find(s => s.cells.includes(i));
                processResult('enemy', i, ship);
                myTurn = false; setTimeout(computerAI, 800);
            } else { socket.emit('attack', { index: i }); myTurn = false; }
        }

        function processResult(prefix, index, ship) {
            const cell = document.getElementById(`${prefix}-${index}`);
            if (ship) {
                cell.classList.add('hit'); cell.innerHTML += `<span class="boom">💥</span>`;
                ship.hits++;
                if (ship.hits === ship.cells.length) {
                    ship.sunk = true; ship.cells.forEach(c => document.getElementById(`${prefix}-${c}`).classList.add('sunk'));
                    if (checkWin(prefix === 'enemy' ? computerFleet : myFleet)) { alert(prefix === 'enemy' ? "你贏了！" : "你輸了！"); location.reload(); }
                }
            } else { cell.classList.add('miss'); }
        }

        function computerAI() {
            let t; do { t = Math.floor(Math.random() * 100); } while (document.getElementById(`my-${t}`).dataset.attacked);
            document.getElementById(`my-${t}`).dataset.attacked = "true";
            processResult('my', t, myFleet.find(s => s.cells.includes(t)));
            myTurn = true;
        }

        function checkWin(fleet) { return fleet.every(s => s.sunk); }

        function setupComputer() {
            fleetSchema.forEach(len => {
                let ok = false;
                while(!ok) {
                    let s = Math.floor(Math.random()*100), v = Math.random()>0.5, c = [];
                    for(let i=0; i<len; i++) {
                        let next = v ? s+i*10 : s+i;
                        if(next >= 100 || (!v && Math.floor(next/10) !== Math.floor(s/10))) { c=[]; break; }
                        c.push(next);
                    }
                    if(c.length > 0 && c.every(x => !computerFleet.some(ship => ship.cells.includes(x)))) {
                        computerFleet.push({cells:c, hits:0, sunk:false}); ok = true;
                    }
                }
            });
        }

        socket.on('gameStart', (firstId) => {
            myTurn = (socket.id === firstId);
            document.getElementById('status').innerText = myTurn ? "你的回合" : "對手回合";
        });

        socket.on('opp-attack', (data) => {
            const ship = myFleet.find(s => s.cells.includes(data.index));
            processResult('my', data.index, ship);
            socket.emit('result', { index: data.index, isHit: !!ship, isSunk: ship?.sunk, shipCells: ship?.cells });
            myTurn = true;
            document.getElementById('status').innerText = "你的回合";
        });

        socket.on('attack-result', (data) => {
            const cell = document.getElementById(`enemy-${data.index}`);
            if (data.isHit) {
                cell.classList.add('hit'); cell.innerHTML += `<span class="boom">💥</span>`;
                if (data.isSunk) {
                    data.shipCells.forEach(c => document.getElementById(`enemy-${c}`).classList.add('sunk'));
                    alert("擊沈對方船隻！");
                }
            } else cell.classList.add('miss');
        });
    </script>
</body>
</html>
